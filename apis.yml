aid: dusty-robotics
name: Dusty Robotics
description: >-
  Dusty Robotics is a construction-technology company building automated
  layout robotics for the building trades. Its flagship product, the
  FieldPrinter, is a mobile robot that prints digital BIM models and design
  drawings directly onto the jobsite floor at full scale, laying out walls,
  penetrations, and other design intent so field teams build to plan with far
  less manual measurement and rework. The FieldPrinter platform ingests
  drawings from tools like Autodesk Revit and AutoCAD via native plugins,
  translating the digital model into precise physical markings on the deck.
  Dusty Robotics is headquartered in Mountain View, California and is backed
  by investors including Canaan Partners. The company does not currently
  publish a public developer API, SDK, or developer portal; its published
  surfaces are the product site, a partner program, a support center, and the
  Dusty Academy training resource.
